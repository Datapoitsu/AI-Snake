<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Game</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111827;
      color: white;
      font-family: Arial, sans-serif;
    }

    .game {
      width: 440px;
      max-width: 95vw;
      text-align: center;
    }

    h1 {
      margin: 0 0 15px;
      font-size: 40px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 18px;
    }

    button {
      padding: 8px 15px;
      border: 0;
      border-radius: 6px;
      background: #22c55e;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #16a34a;
    }

    canvas {
      display: block;
      width: 400px;
      height: 400px;
      max-width: 100%;
      margin: auto;
      background: #1f2937;
      border: 4px solid #374151;
      border-radius: 8px;
    }

    #message {
      min-height: 24px;
      margin: 12px 0;
      color: #f87171;
      font-weight: bold;
    }

    .controls {
      margin-top: 15px;
      color: #9ca3af;
    }
  </style>
</head>

<body>

  <div class="game">
    <h1>🐍 Snake</h1>

    <div class="top-bar">
      <div>Score: <span id="score">0</span></div>
      <button id="restart">Restart</button>
    </div>

    <canvas id="canvas" width="400" height="400"></canvas>

    <div id="message"></div>

    <div class="controls">
      Use <b>Arrow Keys</b> or <b>W A S D</b> to move
    </div>
  </div>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    const scoreText = document.getElementById("score");
    const message = document.getElementById("message");
    const restartButton = document.getElementById("restart");

    const cellSize = 20;
    const cells = canvas.width / cellSize;

    let snake;
    let food;
    let direction;
    let nextDirection;
    let score;
    let gameOver;
    let speed;
    let timer;

    function startGame() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];

      direction = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };

      score = 0;
      speed = 120;
      gameOver = false;

      scoreText.textContent = score;
      message.textContent = "";

      createFood();

      clearInterval(timer);
      timer = setInterval(gameLoop, speed);

      draw();
    }

    function createFood() {
      do {
        food = {
          x: Math.floor(Math.random() * cells),
          y: Math.floor(Math.random() * cells)
        };
      } while (
        snake.some(part => part.x === food.x && part.y === food.y)
      );
    }

    function gameLoop() {
      if (gameOver) return;

      direction = nextDirection;

      const head = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y
      };

      // Wall collision
      if (
        head.x < 0 ||
        head.x >= cells ||
        head.y < 0 ||
        head.y >= cells
      ) {
        endGame();
        return;
      }

      // Snake collision
      if (
        snake.some(part => part.x === head.x && part.y === head.y)
      ) {
        endGame();
        return;
      }

      snake.unshift(head);

      // Food
      if (head.x === food.x && head.y === food.y) {
        score++;
        scoreText.textContent = score;

        createFood();

        // Make the game faster
        if (score % 5 === 0 && speed > 50) {
          speed -= 10;

          clearInterval(timer);
          timer = setInterval(gameLoop, speed);
        }
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      // Background
      ctx.fillStyle = "#1f2937";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid
      ctx.strokeStyle = "#293548";
      ctx.lineWidth = 1;

      for (let i = 0; i <= canvas.width; i += cellSize) {
        ctx.beginPath();
        ctx.moveTo(i, 0);
        ctx.lineTo(i, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, i);
        ctx.lineTo(canvas.width, i);
        ctx.stroke();
      }

      // Food
      ctx.fillStyle = "#ef4444";
      ctx.beginPath();

      ctx.arc(
        food.x * cellSize + cellSize / 2,
        food.y * cellSize + cellSize / 2,
        cellSize / 2 - 2,
        0,
        Math.PI * 2
      );

      ctx.fill();

      // Snake
      snake.forEach((part, index) => {
        ctx.fillStyle = index === 0 ? "#86efac" : "#22c55e";

        ctx.fillRect(
          part.x * cellSize + 1,
          part.y * cellSize + 1,
          cellSize - 2,
          cellSize - 2
        );
      });
    }

    function changeDirection(x, y) {
      // Don't allow 180-degree turns
      if (x === -direction.x && y === -direction.y) {
        return;
      }

      nextDirection = { x, y };
    }

    function endGame() {
      gameOver = true;
      clearInterval(timer);

      message.textContent =
        "Game Over! Press Restart to play again.";
    }

    document.addEventListener("keydown", function(event) {
      const key = event.key.toLowerCase();

      if (
        key === "arrowup" ||
        key === "w"
      ) {
        event.preventDefault();
        changeDirection(0, -1);
      }

      else if (
        key === "arrowdown" ||
        key === "s"
      ) {
        event.preventDefault();
        changeDirection(0, 1);
      }

      else if (
        key === "arrowleft" ||
        key === "a"
      ) {
        event.preventDefault();
        changeDirection(-1, 0);
      }

      else if (
        key === "arrowright" ||
        key === "d"
      ) {
        event.preventDefault();
        changeDirection(1, 0);
      }

      // Press Space to restart
      else if (key === " " && gameOver) {
        startGame();
      }
    });

    restartButton.addEventListener("click", startGame);

    // Start the game
    startGame();
  </script>

</body>
</html>
